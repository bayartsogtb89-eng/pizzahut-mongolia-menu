<script>
  const catalog = JSON.parse(document.getElementById('catalog').textContent);
  const filters = document.getElementById('filters');
  const products = document.getElementById('products');
  const query = document.getElementById('query');
  const count = document.getElementById('count');
  const money = new Intl.NumberFormat('mn-MN');
  let category = '';

  function add(parent, tag, content, className) {
    const node = document.createElement(tag);
    if (content) node.textContent = content;
    if (className) node.className = className;
    parent.append(node);
    return node;
  }

  function productCard(item) {
    const card = document.createElement('article');
    const figure = add(card, 'figure');
    const photo = add(figure, 'img');
    const missing = add(figure, 'figcaption', 'Зураг ачаалагдсангүй');
    missing.hidden = true;
    photo.alt = item.name;
    photo.loading = 'lazy';
    photo.addEventListener('error', () => {
      photo.hidden = true;
      missing.hidden = false;
    });
    photo.src = item.image_path || item.image_url;
    const body = add(card, 'div', '', 'body');
    add(body, 'p', catalog.categories[item.category], 'category');
    add(body, 'h2', item.name);
    add(body, 'strong', money.format(item.displayed_price_mnt) + ' ₮');
    if (item.default_size) add(body, 'p', item.default_size + ' · ' + item.default_crust);
    add(body, 'p', item.description);
    if (item.serves) add(body, 'p', item.serves + ' хүний');
    if (item.listed_sizes.length > 1) add(body, 'p', 'Хэмжээ ' + item.listed_sizes.join(' / '));
    if (item.listed_crusts_at_default_size.length > 1) {
      add(body, 'p', 'Эхний хэмжээнд харагдсан гурил ' + item.listed_crusts_at_default_size.join(' / '));
    }
    if (item.description_partial) add(body, 'p', 'Цэсэнд тайлбарын хэсэг харагдсан.', 'note');
    add(body, 'a', 'Эх сурвалж').href = item.source_url;
    return card;
  }

  const cards = catalog.items.map(item => {
    const element = productCard(item);
    products.append(element);
    return { item, element, searchable: (item.name + ' ' + item.description).toLocaleLowerCase('mn') };
  });

  function update() {
    const search = query.value.trim().toLocaleLowerCase('mn');
    let visible = 0;
    for (const card of cards) {
      card.element.hidden = Boolean(category && category !== card.item.category) || !card.searchable.includes(search);
      if (!card.element.hidden) visible++;
    }
    count.textContent = visible ? visible + ' бүртгэл' : 'Илэрц олдсонгүй';
    for (const button of filters.querySelectorAll('button')) {
      button.setAttribute('aria-pressed', String(button.dataset.category === category));
    }
  }

  for (const [key, label] of [['', 'Бүгд'], ...Object.entries(catalog.categories)]) {
    const button = add(filters, 'button', label);
    button.type = 'button';
    button.dataset.category = key;
    button.addEventListener('click', () => {
      category = key;
      update();
    });
  }
  query.addEventListener('input', update);
  update();
</script>
